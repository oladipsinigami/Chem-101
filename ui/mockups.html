<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chemistry 101 — UI mockups (v2 registry)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E9E6DE; }
  body { font-family: "Atkinson Hyperlegible", system-ui, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  #stage { padding: 18px 24px 40px; }
  .frame { margin: 0 auto 44px; }
  .cap { padding: 0 0 10px; font: 500 11px/16px "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: #7B817B; }

  /* ================= tokens ================= */
  .board {
    --sheet: #FBF9F4;
    --sheet-2: #F3F1EA;
    --raise: #FFFDF9;
    --ink: #171A18;
    --ink-2: #3C433E;
    --muted: #616A63;
    --faint: #8E958F;
    --rule: #DDD9CF;
    --rule-strong: #918C80;
    --accent: #1D4B3B;
    --accent-deep: #14382C;
    --accent-tint: #E7EDE8;
    --amber: #8A5A12;
    --amber-tint: #F6EBD6;

    --serif: "Crimson Pro", Georgia, "Times New Roman", serif;
    --sans: "Atkinson Hyperlegible", system-ui, "Segoe UI", Arial, sans-serif;
    --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;

    position: relative;
    background: var(--sheet);
    color: var(--ink);
    overflow: hidden;
  }
  .board.tab, .board.sm { box-shadow: inset 0 0 0 1px var(--rule); }

  .board[data-theme="dark"] {
    --sheet: #121514;
    --sheet-2: #191D1B;
    --raise: #1C211E;
    --ink: #EDEBE4;
    --ink-2: #CFD4CE;
    --muted: #A7AFA9;
    --faint: #7C837D;
    --rule: #2A302C;
    --rule-strong: #5E665F;
    --accent: #86C6AA;
    --accent-deep: #9ED4BC;
    --accent-tint: #1E3029;
    --amber: #D9A85C;
    --amber-tint: #2A2418;
  }

  /* ================= header ================= */
  .bar { height: 68px; display: flex; align-items: center; background: var(--sheet); }
  .bar-in { width: 100%; max-width: 1360px; margin: 0 auto; padding: 0 40px; height: 100%; display: flex; align-items: center; }
  .board.tab .bar-in { max-width: 100%; padding: 0 40px; }
  .board.sm .bar { height: 58px; }
  .board.sm .bar-in { padding: 0 16px; }
  .mono-gram {
    width: 28px; height: 28px; flex: none; display: grid; place-items: center;
    background: var(--ink); color: var(--sheet);
    font: 600 15px/1 var(--serif); letter-spacing: .01em;
  }
  .board[data-theme="dark"] .mono-gram { background: var(--ink); color: #121514; }
  .wordmark { font: 700 14px/20px var(--sans); letter-spacing: .02em; margin-left: 12px; }
  .v-rule { width: 1px; height: 18px; background: var(--rule); margin: 0 16px; flex: none; }
  .course-code { font: 500 11px/16px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .board.sm .course-code { margin-left: 12px; }
  .board.sm .bar-right .icon-btn { width: 40px; }
  .course-title { font: 400 14px/20px var(--sans); color: var(--muted); margin-left: 12px; white-space: nowrap; }
  .bar-right { margin-left: auto; display: flex; align-items: center; }
  .save { display: flex; align-items: center; gap: 7px; font: 400 11px/16px var(--mono); color: var(--muted); margin-right: 18px; white-space: nowrap; }
  .save i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; }
  .timer { display: flex; flex-direction: column; align-items: flex-end; padding-right: 18px; }
  .timer-digits { font: 500 21px/24px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .timer-label { font: 400 10px/14px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .board.sm .timer-digits { font: 500 18px/22px var(--mono); }
  .board.sm .timer-label { display: none; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: none;
    font: 400 13px/18px var(--sans);
  }
  .icon-btn.wide { width: auto; padding: 0 12px; margin-left: 2px; }
  .btn-submit {
    height: 40px; padding: 0 16px; margin-left: 4px; flex: none;
    border: 1px solid var(--rule-strong); background: transparent; color: var(--ink);
    font: 700 13px/18px var(--sans); letter-spacing: .01em;
  }
  .board.sm .btn-submit { height: 36px; padding: 0 12px; font-size: 12px; }

  .progress { height: 2px; background: var(--rule); }
  .progress span { display: block; height: 100%; width: 8.3333%; background: var(--accent); }

  /* ================= shell ================= */
  .shell {
    display: grid; grid-template-columns: 104px minmax(0, 1fr) 292px; column-gap: 48px;
    height: calc(100% - 70px); max-width: 1360px; margin: 0 auto; padding: 44px 40px 0;
  }
  .board.sm .shell { display: block; height: calc(100% - 60px); padding: 26px 16px 0; }
  .board.tab .shell {
    display: grid; grid-template-columns: 88px minmax(0, 1fr); column-gap: 32px;
    height: calc(100% - 70px); max-width: 100%; padding: 48px 40px 0;
  }

  /* ================= folio ================= */
  .folio-n { font: 400 58px/56px var(--serif); letter-spacing: -0.03em; font-optical-sizing: auto; }
  .folio-of { font: 400 10px/14px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
  .folio-rule { width: 24px; height: 1px; background: var(--rule-strong); margin-top: 14px; }
  .board.sm .folio-n { font: 400 40px/40px var(--serif); }
  .board.sm .folio-of { margin-top: 8px; }
  .board.sm .folio-rule { margin-top: 10px; width: 18px; }

  /* ================= question ================= */
  .qcol { min-width: 0; padding-bottom: 104px; }
  .meta { display: flex; align-items: center; gap: 12px; min-height: 44px; max-width: 660px; }
  .topic { font: 400 13px/18px var(--sans); color: var(--muted); }
  .meta-rule { flex: 1; height: 1px; background: var(--rule); max-width: 120px; }
  .flag {
    margin-left: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
    border: 0; background: transparent; color: var(--muted); font: 400 13px/18px var(--sans); padding: 0;
  }
  .flag.on { color: var(--amber); }

  .stem {
    font: 400 27px/38px var(--serif); letter-spacing: -0.004em; font-optical-sizing: auto;
    color: var(--ink); margin: 10px 0 0; max-width: 660px; text-wrap: balance;
  }
  .board.tab .stem { font: 400 27px/38px var(--serif); max-width: 640px; }
  .board.sm .stem { font: 400 22px/32px var(--serif); margin-top: 14px; max-width: none; }

  /* ================= options (ruled list) ================= */
  .opts { margin-top: 34px; max-width: 660px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .board.sm .opts { margin-top: 26px; max-width: none; }
  .opt {
    display: grid; grid-template-columns: 30px minmax(0, 1fr) 14px; align-items: center; column-gap: 16px;
    width: 100%; min-height: 62px; padding: 17px 14px;
    border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer;
    font: 400 17px/26px var(--sans);
    box-shadow: inset 0 0 0 0 transparent;
    transition: background-color .12s ease;
  }
  .opt + .opt { border-top: 1px solid var(--rule); }
  .opt .key { font: 500 13px/18px var(--mono); color: var(--muted); letter-spacing: .02em; }
  .opt .mark { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--rule-strong); }
  .opt:hover { background: var(--sheet-2); }
  .opt.on { background: var(--accent-tint); box-shadow: inset 2px 0 0 var(--accent); }
  .opt.on .key { color: var(--accent); font-weight: 500; }
  .opt.on .mark { background: var(--accent); border-color: var(--accent); }
  .opt.on .olt { font-weight: 400; }
  .board.sm .opt { grid-template-columns: 26px minmax(0, 1fr) 12px; column-gap: 12px; min-height: 56px; padding: 15px 10px; font: 400 16px/24px var(--sans); }
  .board.sm .opt.on { box-shadow: inset 2px 0 0 var(--accent); }

  /* ================= answer bar ================= */
  .abar { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: var(--sheet); border-top: 1px solid var(--rule); display: flex; align-items: center; z-index: 4; }
  .abar-in {
    width: 100%; max-width: 1360px; margin: 0 auto; padding: 0 40px; align-items: center;
    display: grid; grid-template-columns: 104px minmax(0, 1fr) 292px; column-gap: 48px;
  }
  .abar-main { grid-column: 2; width: 100%; max-width: 660px; display: flex; align-items: center; gap: 16px; }
  .board.tab .abar-in { max-width: 100%; padding: 0 40px; grid-template-columns: 88px minmax(0, 1fr); column-gap: 32px; }
  .board.tab .abar-main { max-width: none; }
  .board.sm .abar { height: 68px; }
  .board.sm .abar-in { display: flex; padding: 0 16px; gap: 8px; }
  .board.sm .abar-main { max-width: none; gap: 8px; }
  .txt-btn { border: 0; background: transparent; color: var(--muted); font: 400 13px/18px var(--sans); padding: 0; min-height: 44px; }
  .txt-btn:hover { color: var(--ink); }
  .board.sm .qcol .txt-btn { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-strong); }
  .nav { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .btn {
    height: 44px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    font: 700 13px/18px var(--sans); letter-spacing: .01em; background: transparent; border-radius: 0;
  }
  .btn-ghost { border: 1px solid var(--rule-strong); color: var(--ink); }
  .btn-ink { border: 1px solid var(--ink); background: var(--ink); color: var(--sheet); }
  .board[data-theme="dark"] .btn-ink { border-color: var(--ink); background: var(--ink); color: #121514; }
  .board.sm .btn { height: 46px; }
  .board.sm .abar .nav { display: flex; width: 100%; gap: 8px; }
  .board.sm .abar .btn { flex: 1 1 0; }
  .board.sm .abar .btn-ink { flex: 1.4 1 0; }
  .board.sm .abar .txt-btn { display: none; }

  /* ================= map / index ================= */
  .rail { border-left: 1px solid var(--rule); padding: 4px 0 0 40px; }
  .rail-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .eyebrow { font: 500 10px/14px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .rail-count { font: 400 12px/16px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
  .rail-rule { height: 1px; background: var(--rule); margin: 12px 0 16px; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; }
  .lg { display: flex; align-items: center; gap: 8px; font: 400 12px/16px var(--sans); color: var(--muted); }
  .gl { width: 14px; height: 14px; flex: none; position: relative; }
  .gl.ans::after { content: ""; position: absolute; left: 1px; right: 1px; bottom: 3px; height: 2px; background: var(--accent); }
  .gl.un::after { content: ""; position: absolute; left: 1px; right: 1px; bottom: 3px; height: 1px; background: var(--rule-strong); }
  .gl.cur::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 2px; background: var(--ink); }
  .gl.fl::after { content: ""; position: absolute; right: 1px; top: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }

  .grid { display: grid; grid-template-columns: repeat(6, 1fr); margin: 16px -6px 18px; }
  .cell {
    position: relative; height: 34px; display: flex; align-items: center;
    padding-left: 7px; font: 400 12px/16px var(--mono); font-variant-numeric: tabular-nums;
    color: var(--muted); text-decoration: none;
  }
  .cell.ans { color: var(--accent); }
  .cell.ans::after { content: ""; position: absolute; left: 7px; right: 12px; bottom: 3px; height: 2px; background: var(--accent); }
  .cell.cur { color: var(--ink); font-weight: 500; }
  .cell.cur::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; background: var(--ink); }
  .cell .fd { position: absolute; right: 9px; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }

  .counts { border-top: 1px solid var(--rule); }
  .crow { display: flex; align-items: baseline; justify-content: space-between; height: 34px; border-bottom: 1px solid var(--rule); font: 400 13px/18px var(--sans); color: var(--muted); }
  .crow b { font: 500 12px/16px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
  .save-note { margin-top: 20px; font: 400 12px/17px var(--sans); color: var(--muted); max-width: 30ch; }

  /* ================= dialog ================= */
  .backdrop { position: absolute; inset: 0; background: rgba(12,15,13,.44); z-index: 8; }
  .dialog {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 500px; background: var(--raise); border: 1px solid var(--rule-strong);
    padding: 34px 36px 30px; z-index: 9; box-shadow: 0 32px 80px rgba(12,15,13,.22);
  }
  .dialog::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent); }
  .dialog h2 { margin: 0; font: 400 25px/32px var(--serif); letter-spacing: -0.004em; }
  .dialog .lead { margin: 10px 0 0; font: 400 15px/23px var(--sans); color: var(--muted); }
  .tally { margin: 22px 0 0; border-top: 1px solid var(--rule); }
  .trow { display: flex; align-items: baseline; justify-content: space-between; height: 42px; border-bottom: 1px solid var(--rule); }
  .trow .tk { font: 400 13px/18px var(--sans); color: var(--muted); }
  .trow .tv { font: 500 14px/20px var(--mono); font-variant-numeric: tabular-nums; }
  .dialog .note { margin: 16px 0 0; font: 400 13px/20px var(--sans); color: var(--muted); }
  .dact { display: flex; justify-content: flex-end; gap: 10px; margin-top: 26px; }
  .dact .btn { height: 44px; }

  /* ================= mobile sheet ================= */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 9;
    background: var(--raise); border-top: 1px solid var(--rule-strong);
    padding: 10px 20px 24px; box-shadow: 0 -24px 64px rgba(12,15,13,.24);
  }
  .grab { width: 36px; height: 3px; background: var(--rule-strong); margin: 0 auto 14px; }
  .sheet-head { display: flex; align-items: flex-end; justify-content: space-between; }
  .sheet h2 { margin: 4px 0 0; font: 400 23px/28px var(--serif); }
  .sheet .rail-count { padding-bottom: 3px; }
  .sheet-rule { height: 1px; background: var(--rule); margin: 14px 0 0; }
  .sheet-grid { display: grid; grid-template-columns: repeat(5, 1fr); margin: 0 -6px 14px; }
  .scell {
    position: relative; height: 44px; display: flex; align-items: center; padding-left: 8px;
    font: 400 13px/18px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted);
    border-bottom: 1px solid var(--rule);
  }
  .scell.ans { color: var(--accent); }
  .scell.ans::after { content: ""; position: absolute; left: 8px; right: 14px; bottom: 4px; height: 2px; background: var(--accent); }
  .scell.cur { color: var(--ink); font-weight: 500; }
  .scell.cur::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; background: var(--ink); }
  .scell .fd { position: absolute; right: 12px; top: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
  .sheet .legend { margin: 0 0 16px; gap: 8px 16px; }
  .sheet .btn { width: 100%; height: 48px; }

  /* ================= receipt ================= */
  .receipt-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 40px; }
  .receipt { width: 620px; background: var(--raise); border: 1px solid var(--rule-strong); padding: 44px 48px 36px; position: relative; }
  .receipt::before { content: ""; position: absolute; left: 48px; top: 0; width: 36px; height: 2px; background: var(--accent); }
  .receipt .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .receipt .brand .mono-gram { width: 24px; height: 24px; font: 600 13px/1 var(--serif); }
  .receipt .brand .nm { font: 700 12px/16px var(--sans); letter-spacing: .03em; }
  .receipt h1 { margin: 12px 0 0; font: 400 36px/44px var(--serif); letter-spacing: -0.012em; }
  .receipt .sub { margin: 8px 0 0; font: 400 15px/23px var(--sans); color: var(--muted); max-width: 44ch; }
  .meta-list { margin-top: 26px; border-top: 1px solid var(--rule); }
  .mrow { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; min-height: 44px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
  .mrow .k { font: 500 10px/14px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .mrow .v { font: 400 15px/22px var(--sans); color: var(--ink); text-align: right; }
  .mrow .v.mono { font: 500 13px/18px var(--mono); letter-spacing: .02em; }
  .handoff { margin: 22px 0 0; font: 400 14px/22px var(--sans); color: var(--muted); max-width: 46ch; }
  .artifacts { margin-top: 4px; }
  .art { display: flex; align-items: center; gap: 20px; min-height: 76px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .art:first-child { border-top: 1px solid var(--rule); margin-top: 16px; }
  .art .an { font: 700 14px/20px var(--sans); letter-spacing: .01em; }
  .art .am { font: 400 11px/16px var(--mono); color: var(--muted); margin-top: 4px; letter-spacing: .04em; }
  .art .dl { margin-left: auto; flex: none; }
  .art .btn { height: 40px; padding: 0 14px; font-size: 12px; }
  .btn-outline { border: 1px solid var(--rule-strong); color: var(--ink); }
  .redl { margin: 16px 0 0; font: 400 12px/18px var(--sans); color: var(--muted); max-width: 46ch; }
  .closex { margin: 22px 0 0; font: 400 13px/18px var(--sans); color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-strong); }

  /* ================= a11y ================= */
  .board :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
  .cell:focus-visible, .scell:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
  @media (prefers-reduced-motion: reduce) { .opt { transition: none; } }

  svg { display: block; }
</style>
</head>
<body>
<main id="stage"></main>

<script>
const ICON = {
  map: '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 4.5h4.5v4.5H3zM12.5 4.5H17v4.5h-4.5zM3 11h4.5v4.5H3zM12.5 11H17v4.5h-4.5z"/></svg>',
  moon: '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M16.5 12.3A6.5 6.5 0 0 1 7.7 3.5a6.5 6.5 0 1 0 8.8 8.8Z"/></svg>',
  sun: '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.4v1.6M10 16v1.6M2.4 10h1.6M16 10h1.6M4.6 4.6l1.1 1.1M14.3 14.3l1.1 1.1M15.4 4.6l-1.1 1.1M5.7 14.3l-1.1 1.1"/></svg>',
  flag: '<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 17V4h9l-1.4 3.2L14 11H5"/></svg>',
  flagFill: '<svg width="17" height="17" viewBox="0 0 20 20" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 17V4h9l-1.4 3.2L14 11H5"/></svg>',
  left: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l-5 5 5 5"/></svg>',
  right: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"/></svg>',
  download: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9M6.5 8.5 10 12l3.5-3.5M4 15h12"/></svg>'
};

const q = {
  n: 6, total: 60, topic: 'Atomic structure',
  stem: 'Which ion is isoelectronic with neon?',
  options: ['K⁺', 'Cl⁻', 'Na⁺', 'Ar'],
  selected: 2, flagged: true
};
const answered = [1, 2, 4, 5, 6];
const flagged = [3, 9];
const pad = n => String(n).padStart(2, '0');

function header(opts) {
  const { mobile = false, theme = 'light', tablet = false } = opts;
  return `
  <div class="bar">
    <div class="bar-in">
    <div class="mono-gram">C</div>
    ${mobile ? '' : '<span class="wordmark">CCF NIFES</span>'}
    ${mobile ? '' : '<span class="v-rule"></span>'}
    <span class="course-code">CHE 101</span>
    ${mobile || tablet ? '' : '<span class="course-title">Chemistry 101 · Mid-semester CBT</span>'}
    <div class="bar-right">
      ${mobile ? '' : '<span class="save"><i></i>Saved 14:12</span>'}
      <div class="timer">
        <span class="timer-digits">24:55</span>
        ${mobile ? '' : '<span class="timer-label">remaining</span>'}
      </div>
      <button class="icon-btn ${tablet ? 'wide' : ''}" aria-label="Open question map">${ICON.map}${tablet ? '<span>Map</span>' : ''}</button>
      ${mobile || tablet ? '' : `<button class="icon-btn" aria-label="Switch to ${theme === 'dark' ? 'light' : 'dark'} theme">${theme === 'dark' ? ICON.sun : ICON.moon}</button>`}
      <button class="btn-submit">${mobile ? 'Submit' : 'Submit exam'}</button>
    </div>
    </div>
  </div>
  <div class="progress"><span></span></div>`;
}

function indexCells(n) {
  return Array.from({ length: n }, (_, i) => i + 1).map(nn => {
    const cls = ['cell', answered.includes(nn) ? 'ans' : '', nn === q.n ? 'cur' : ''].filter(Boolean).join(' ');
    return `<span class="${cls}" ${nn === q.n ? 'aria-current="step"' : ''} tabindex="${nn === q.n ? '0' : '-1'}">${pad(nn)}${flagged.includes(nn) ? '<i class="fd"></i>' : ''}</span>`;
  }).join('');
}

function sheetCells(n) {
  return Array.from({ length: n }, (_, i) => i + 1).map(nn => {
    const cls = ['scell', answered.includes(nn) ? 'ans' : '', nn === q.n ? 'cur' : ''].filter(Boolean).join(' ');
    return `<span class="${cls}" ${nn === q.n ? 'aria-current="step"' : ''}>${pad(nn)}${flagged.includes(nn) ? '<i class="fd"></i>' : ''}</span>`;
  }).join('');
}

function legend() {
  return `
  <div class="legend">
    <span class="lg"><span class="gl ans"></span>Answered</span>
    <span class="lg"><span class="gl un"></span>Unanswered</span>
    <span class="lg"><span class="gl fl"></span>Flagged</span>
    <span class="lg"><span class="gl cur"></span>Current</span>
  </div>`;
}

function question(opts) {
  const { mobile = false, rail = true } = opts;
  const opts_html = q.options.map((o, i) => `
    <button class="opt ${i === q.selected ? 'on' : ''}" aria-pressed="${i === q.selected}">
      <span class="key">${'ABCDEF'[i]}</span>
      <span class="olt">${o}</span>
      <span class="mark" aria-hidden="true"></span>
    </button>`).join('');

  return `
  <div class="shell">
    <aside class="folio" aria-hidden="true">
      <div class="folio-n">${pad(q.n)}</div>
      <div class="folio-of">of ${q.total}</div>
      <div class="folio-rule"></div>
    </aside>
    <section class="qcol">
      <div class="meta">
        <span class="topic">${q.topic}</span>
        <span class="meta-rule"></span>
        <button class="flag ${q.flagged ? 'on' : ''}">${q.flagged ? ICON.flagFill : ICON.flag} ${q.flagged ? 'Flagged' : 'Flag for review'}</button>
      </div>
      <h1 class="stem">${q.stem}</h1>
      <div class="opts" role="group" aria-label="Answer options">${opts_html}</div>
      ${mobile ? '<div style="margin-top:10px"><button class="txt-btn">Clear answer</button></div>' : ''}
    </section>
    ${rail ? `
    <aside class="rail">
      <div class="rail-head">
        <span class="eyebrow">Question map</span>
        <span class="rail-count">5 / 60</span>
      </div>
      <div class="rail-rule"></div>
      ${legend()}
      <div class="grid">${indexCells(60)}</div>
      <div class="counts">
        <div class="crow"><span>Answered</span><b>05</b></div>
        <div class="crow"><span>Unanswered</span><b>55</b></div>
        <div class="crow"><span>Flagged</span><b>02</b></div>
      </div>
      <div class="save-note">Answers save as you go. Refreshing returns you to the clock, still running.</div>
    </aside>` : ''}
  </div>
  <div class="abar">
    <div class="abar-in">
      <div class="abar-main">
        <button class="txt-btn">Clear answer</button>
        <div class="nav">
          <button class="btn btn-ghost">${ICON.left} Previous</button>
          <button class="btn btn-ink">Next ${ICON.right}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function board(name, w, h, theme, cls, inner) {
  return `<div class="frame" style="width:${w}px">
    <div class="cap">${name} &nbsp;·&nbsp; ${w} × ${h}</div>
    <div class="board ${cls}" data-theme="${theme}" style="width:${w}px;height:${h}px">${inner}</div>
  </div>`;
}

const stage = document.getElementById('stage');
stage.innerHTML = [
  board('Exam screen — desktop, light', 1440, 900, 'light', '', header({}) + question({})),
  board('Exam screen — desktop, dark', 1440, 900, 'dark', '', header({ theme: 'dark' }) + question({})),
  board('Exam screen — tablet 834', 834, 1112, 'light', 'tab', header({ tablet: true }) + question({ rail: false })),
  board('Exam screen — mobile 390', 390, 844, 'light', 'sm', header({ mobile: true }) + question({ mobile: true, rail: false })),
  board('Submit dialog', 1440, 900, 'light', '', header({}) + question({}) + `
    <div class="backdrop"></div>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Submit this exam?</h2>
      <p class="lead">19 questions are unanswered. They score zero.</p>
      <div class="tally">
        <div class="trow"><span class="tk">Answered</span><span class="tv">41</span></div>
        <div class="trow"><span class="tk">Unanswered</span><span class="tv">19</span></div>
        <div class="trow"><span class="tk">Flagged for review</span><span class="tv">02</span></div>
      </div>
      <p class="note">Once submitted, the exam cannot be reopened.</p>
      <div class="dact">
        <button class="btn btn-ghost">Keep working</button>
        <button class="btn btn-ink">Submit anyway</button>
      </div>
    </div>`),
  board('Question map sheet — mobile 390', 390, 844, 'light', 'sm', header({ mobile: true }) + question({ mobile: true, rail: false }) + `
    <div class="backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="grab"></div>
      <div class="sheet-head">
        <div>
          <span class="eyebrow">Exam navigation</span>
          <h2 id="sheet-title">Question map</h2>
        </div>
        <span class="rail-count">5 / 60 answered</span>
      </div>
      <div class="sheet-rule"></div>
      <div class="sheet-grid">${sheetCells(60)}</div>
      ${legend()}
      <button class="btn btn-ink">Submit exam</button>
    </div>`),
  board('Submission receipt', 1440, 900, 'light', '', `
    <div class="receipt-wrap">
      <div class="receipt">
        <div class="brand"><span class="mono-gram">C</span><span class="nm">CCF NIFES</span></div>
        <span class="eyebrow">CHE 101 · Submission complete</span>
        <h1>Exam submitted</h1>
        <p class="sub">Your answers are recorded. Results are issued as PDFs and are never shown on screen.</p>
        <div class="meta-list">
          <div class="mrow"><span class="k">Submitted</span><span class="v">14:32 · 12 Nov 2026</span></div>
          <div class="mrow"><span class="k">Answered</span><span class="v mono">60 of 60</span></div>
          <div class="mrow"><span class="k">Reference</span><span class="v mono">CH101-8F3K2</span></div>
          <div class="mrow"><span class="k">Candidate</span><span class="v mono">NIF/CHE/20481</span></div>
        </div>
        <p class="handoff">Two documents are available to download.</p>
        <div class="artifacts">
          <div class="art">
            <div>
              <div class="an">Official Examination Record</div>
              <div class="am">1 page · PDF</div>
            </div>
            <div class="dl"><button class="btn btn-ink">${ICON.download} Download</button></div>
          </div>
          <div class="art">
            <div>
              <div class="an">Detailed Review</div>
              <div class="am">18 pages · PDF · includes answer key</div>
            </div>
            <div class="dl"><button class="btn btn-outline">${ICON.download} Download</button></div>
          </div>
        </div>
        <p class="redl">Both files can be downloaded again from this exam in your course hub.</p>
        <p class="closex">Close</p>
      </div>
    </div>`)
].join('');
</script>
</body>
</html>
